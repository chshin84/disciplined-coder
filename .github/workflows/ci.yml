name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 목록을 여기 열거하지 않는다 — scripts/ 디렉터리가 정본이고, 열거하면 새 테스트가 조용히 빠진다.
      - name: 계약 테스트 전부 (각 FAIL=0)
        run: |
          set -e
          ran=0
          for t in scripts/test_*.sh; do
            echo "::group::$t"
            bash "$t"
            echo "::endgroup::"
            ran=$((ran+1))
          done
          [ "$ran" -gt 0 ] || { echo "계약 테스트를 하나도 찾지 못했다 — 글롭이 빗나갔다"; exit 1; }
          echo "계약 테스트 $ran개 통과"

  plugin-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Claude Code CLI 설치
        run: npm install -g @anthropic-ai/claude-code
      - name: plugin validate
        run: claude plugin validate ./
