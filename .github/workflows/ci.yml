name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 목록을 여기 열거하지 않는다 — scripts/ 디렉터리가 정본이고, 열거하면 새 테스트가 조용히 빠진다.
      # 실패 처리는 CLAUDE.md의 실행 명령과 같은 형태다. 첫 실패에서 멈추면 뒤 스크립트가 아예 안 돌아
      # 한 회차로 무엇이 더 깨졌는지 알 수 없다. 그래서 전부 돌리고 실패한 이름을 모아 마지막에 알린다.
      - name: 계약 테스트 전부 (각 FAIL=0)
        run: |
          ran=0; bad=""
          for t in scripts/test_*.sh; do
            echo "::group::$t"
            bash "$t" || bad="$bad $t"
            echo "::endgroup::"
            ran=$((ran+1))
          done
          [ "$ran" -gt 0 ] || { echo "계약 테스트를 하나도 찾지 못했다 — 글롭이 빗나갔다"; exit 1; }
          [ -z "$bad" ] || { echo "FAILED:$bad"; exit 1; }
          echo "계약 테스트 $ran개 통과"

  plugin-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Claude Code CLI 설치
        run: npm install -g @anthropic-ai/claude-code
      - name: plugin validate
        run: claude plugin validate ./
